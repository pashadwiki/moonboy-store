<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf6ec">
<title>MoonBoy Store — Status Pesanan</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">
</head>
<body>
<div class="wrap wrap-narrow">
  <a class="back" href="index.html">← Kembali ke toko</a>
  <h1 class="page">Status Pesanan</h1>

  <div class="panel status-panel">
   <div class="panel-in">
    <div class="status-big" id="status-icon">⏳</div>
    <div class="status-title" id="status-title">Memuat…</div>
    <div class="status-sub" id="status-sub">Sedang mengambil status pesanan kamu.</div>
    <div style="margin-top:14px">
      <div class="kv"><span class="k">No. Pesanan</span><span class="v" id="kv-trx">-</span></div>
      <div class="kv"><span class="k">Produk</span><span class="v" id="kv-product">-</span></div>
      <div class="kv"><span class="k">ID Tujuan</span><span class="v" id="kv-target">-</span></div>
      <div class="kv"><span class="k">Harga</span><span class="v" id="kv-price">-</span></div>
      <div class="kv" id="row-sn" style="display:none"><span class="k">Serial Number</span><span class="v" id="kv-sn">-</span></div>
    </div>
    <div class="msg" id="status-msg"></div>
   </div>
  </div>

  <footer class="site">Halaman ini memperbarui status otomatis tiap 5 detik.</footer>
</div>

<script>
const id = new URLSearchParams(location.search).get('id');
const rp = (n) => (n === null || n === undefined) ? '-' : 'Rp' + new Intl.NumberFormat('id-ID').format(n);
let timer = null;

function render(o) {
  document.getElementById('kv-trx').textContent = o.buyer_trx_id;
  document.getElementById('kv-product').textContent = o.product_name || o.sku_code || '-';
  document.getElementById('kv-target').textContent = o.customer_target + (o.customer_target_zone ? ' (' + o.customer_target_zone + ')' : '');
  document.getElementById('kv-price').textContent = rp(o.sell_price);
  if (o.serial_number) {
    document.getElementById('row-sn').style.display = 'flex';
    document.getElementById('kv-sn').textContent = o.serial_number;
  }
  const icon = document.getElementById('status-icon');
  const title = document.getElementById('status-title');
  const sub = document.getElementById('status-sub');
  const msg = document.getElementById('status-msg');
  msg.className = 'msg';
  if (o.status === 'success') {
    icon.textContent = '✅';
    title.textContent = 'Berhasil!';
    sub.textContent = 'Top up kamu sudah masuk ke akun tujuan. Selamat bermain!';
    stopPolling();
  } else if (o.status === 'failed') {
    icon.textContent = '❌';
    title.textContent = 'Pesanan Gagal';
    sub.textContent = 'Pesanan tidak bisa diselesaikan.';
    if (o.error_message) { msg.textContent = o.error_message; msg.className = 'msg show err'; }
    stopPolling();
  } else {
    icon.textContent = '⏳';
    title.textContent = 'Sedang Diproses';
    sub.textContent = 'Pesanan kamu lagi diproses. Tunggu sebentar ya…';
  }
}

function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }

async function poll() {
  if (!id) {
    document.getElementById('status-title').textContent = 'Nomor pesanan tidak ada.';
    return;
  }
  try {
    const res = await fetch('/api/order/' + encodeURIComponent(id));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memuat');
    render(data);
  } catch (e) {
    document.getElementById('status-sub').textContent = e.message;
  }
}

poll();
timer = setInterval(poll, 5000);
</script>
</body>
</html>
